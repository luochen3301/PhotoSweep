services:
  photosweep:
    build:
      context: .
      dockerfile: Dockerfile
    image: photosweep:local
    container_name: photosweep
    ports:
      - "${PHOTOSWEEP_PORT:-8080}:8080"
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      PHOTOSWEEP_DATA_DIR: /app/data
      PHOTOSWEEP_CACHE_DIR: /app/cache
      PHOTOSWEEP_TRASH_DIR: /trash
      PHOTOSWEEP_ALLOWED_MEDIA_ROOTS: /media
      PHOTOSWEEP_COOKIE_SECURE: "${PHOTOSWEEP_COOKIE_SECURE:-false}"
      PHOTOSWEEP_PUBLIC_ORIGIN: "${PHOTOSWEEP_PUBLIC_ORIGIN:-}"
      FORWARDED_ALLOW_IPS: "${FORWARDED_ALLOW_IPS:-127.0.0.1}"
      TZ: "${TZ:-Pacific/Auckland}"
    volumes:
      - "${PHOTOS_PATH:-./sample-media}:/media/photos:${PHOTOS_MODE:-ro}"
      - "${PHOTOSWEEP_DATA_PATH:-./data}:/app/data"
      - "${PHOTOSWEEP_CACHE_PATH:-./cache}:/app/cache"
      - "${PHOTOSWEEP_TRASH_PATH:-./trash}:/trash"
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      # Root init must forward shutdown signals to the downgraded application UID.
      - KILL
    security_opt:
      - no-new-privileges:true
    init: true
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
