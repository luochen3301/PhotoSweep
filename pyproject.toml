[project]
name = "photosweep"
version = "0.1.0"
description = "A safe, lightweight NAS photo cleanup tool."
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14,<2",
  "argon2-cffi>=23.1,<26",
  "fastapi>=0.115,<1",
  "pillow>=10.4,<13",
  "pillow-heif>=0.18,<2",
  "pydantic-settings>=2.6,<3",
  "python-multipart>=0.0.12,<1",
  "sqlalchemy>=2.0.36,<3",
  "uvicorn[standard]>=0.32,<1",
  "xxhash>=3.5,<4",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.8,<1",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"backend/migrations/*" = ["F403"]
"backend/migrations/versions/*" = ["E501"]
